[package]
name = "bytesetscan"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
description = "SIMD-accelerated byte-set matching with Shufti and Truffle"
license = "MIT"
readme = "README.md"
repository = "https://github.com/WangLabCSU/bytesetscan"
documentation = "https://docs.rs/bytesetscan"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]
keywords = ["shufti", "truffle", "simd", "search", "bytes"]
categories = ["algorithms", "text-processing", "no-std"]

[features]
default = ["std"]
std = []

[package.metadata.docs.rs]
all-features = true

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "scan"
path = "benches/scan/main.rs"
harness = false
