name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: 1.89.0
    steps:
      - uses: actions/checkout@v6
      # Follow the Cargo Book's CI setup: use rustup on GitHub-hosted runners.
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Test default features
        run: cargo +${{ matrix.toolchain }} test --locked
      - name: Test without the standard library
        run: cargo +${{ matrix.toolchain }} test --locked --no-default-features
